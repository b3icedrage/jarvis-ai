<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a00">
<title>OASIS Battle Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a00;
  font-family:'Courier New',Courier,monospace;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.hud-top-center{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center}
.hud-player-name{font-size:clamp(14px,3vw,22px);font-weight:bold;color:#ffaa00;
  text-shadow:0 0 10px rgba(255,170,0,.6),0 0 20px rgba(255,100,0,.3);letter-spacing:4px}
.hud-location{font-size:clamp(8px,1.8vw,11px);color:rgba(255,200,100,.5);letter-spacing:3px;margin-top:2px}
.hud-score{position:absolute;top:14px;right:20px;text-align:right}
.hud-score-val{font-size:clamp(16px,3.5vw,26px);font-weight:bold;color:#ffdd44;
  text-shadow:0 0 8px rgba(255,220,60,.5);letter-spacing:2px}
.hud-score-label{font-size:clamp(9px,2vw,12px);color:rgba(255,200,60,.6);letter-spacing:2px}
.hud-bonus{position:absolute;top:16px;left:20px}
.hud-bonus-val{font-size:clamp(12px,2.5vw,18px);font-weight:bold;color:#ff6633;
  text-shadow:0 0 8px rgba(255,100,50,.5);letter-spacing:2px}
.hud-multiplier{position:absolute;top:35%;left:20px;
  font-size:clamp(11px,2.5vw,16px);font-weight:bold;color:#ff4400;
  text-shadow:0 0 12px rgba(255,60,0,.6);letter-spacing:1px;line-height:1.6}
.hud-bottom{position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:flex-end;justify-content:center;padding:0 20px 16px}
.hud-health-wrap{flex:1;max-width:340px;text-align:center}
.hud-health-label{font-size:8px;color:rgba(255,100,60,.5);letter-spacing:3px;margin-bottom:4px}
.hud-health-bar{height:14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,80,40,.3);
  border-radius:2px;overflow:hidden;position:relative}
.hud-health-fill{height:100%;background:linear-gradient(90deg,#ff2200,#ff6600,#ffaa00);
  box-shadow:inset 0 0 8px rgba(255,150,50,.4);transition:width .3s;width:100%}
.hud-health-segments{position:absolute;inset:0;display:flex}
.hud-health-seg{flex:1;border-right:1px solid rgba(0,0,0,.3)}
.hud-attack{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  opacity:0;transition:opacity .3s}
.hud-attack.show{opacity:1}
.hud-attack-text{font-size:clamp(10px,2vw,14px);color:#ff4400;
  text-shadow:0 0 8px rgba(255,60,0,.6);letter-spacing:2px;animation:atkPulse 1s infinite}
@keyframes atkPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}
.hud-combo{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:clamp(28px,7vw,48px);font-weight:bold;color:#ffaa00;
  text-shadow:0 0 15px rgba(255,170,0,.6),0 0 30px rgba(255,100,0,.3);letter-spacing:4px;display:none}
.float-text{position:absolute;pointer-events:none;z-index:12;font-weight:bold;
  animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-60px) scale(.7)}}
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(26,10,0,.97);cursor:pointer}
#title canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}
#title-content{position:relative;z-index:2;text-align:center;padding:0 24px}
#title h1{font-size:clamp(36px,10vw,80px);letter-spacing:18px;
  text-shadow:0 0 30px rgba(255,170,0,.5),0 0 60px rgba(255,80,0,.3);color:#ffaa00;animation:tg 3s ease-in-out infinite}
@keyframes tg{0%,100%{text-shadow:0 0 30px rgba(255,170,0,.5),0 0 60px rgba(255,80,0,.3)}
  50%{text-shadow:0 0 40px rgba(255,170,0,.7),0 0 80px rgba(255,80,0,.5)}}
#title .sub{font-size:clamp(10px,2.5vw,14px);margin:10px 0 24px;opacity:.55;letter-spacing:8px;color:#ff6633}
#title .desc{font-size:clamp(9px,2vw,11px);line-height:2.2;opacity:.35;max-width:440px;margin:0 auto;
  border:1px solid rgba(255,100,0,.15);border-radius:4px;padding:14px 18px;color:#ffcc88}
#title .enter{margin-top:26px;font-size:clamp(13px,3.5vw,18px);letter-spacing:5px;
  animation:pulse 2s ease-in-out infinite;color:#ffaa00}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.97)}}
#mobile-controls{position:absolute;inset:0;z-index:20;display:none}
.mc-zone{position:absolute;border-radius:50%;transition:background .15s}
#mc-move{bottom:24px;left:24px;width:130px;height:130px;
  background:rgba(255,170,0,.05);border:2px solid rgba(255,170,0,.12)}
#mc-knob{width:40px;height:40px;border-radius:50%;position:absolute;
  background:radial-gradient(circle,rgba(255,170,0,.35),rgba(255,170,0,.12));
  box-shadow:0 0 8px rgba(255,170,0,.15);top:45px;left:45px;pointer-events:none}
#mc-look{bottom:24px;right:24px;width:140px;height:140px;
  background:rgba(255,80,0,.04);border:2px solid rgba(255,80,0,.10)}
#mc-look-knob{width:40px;height:40px;border-radius:50%;position:absolute;
  background:radial-gradient(circle,rgba(255,80,0,.30),rgba(255,80,0,.10));
  box-shadow:0 0 8px rgba(255,80,0,.12);top:50px;left:50px;pointer-events:none}
#mc-attack{position:absolute;bottom:140px;right:60px;width:64px;height:64px;border-radius:50%;
  background:rgba(255,60,0,.12);border:2px solid rgba(255,80,0,.25);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,150,50,.7);font-size:12px;font-weight:bold}
#mc-jump{position:absolute;bottom:140px;right:140px;width:52px;height:52px;border-radius:50%;
  background:rgba(255,200,0,.08);border:2px solid rgba(255,200,0,.15);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,200,0,.5);font-size:10px}
.mc-label{position:absolute;font-size:8px;letter-spacing:2px;text-align:center;color:rgba(255,255,255,.15);pointer-events:none}
#mc-move-label{bottom:158px;left:24px;width:130px}
#mc-look-label{bottom:158px;right:24px;width:140px}
</style>
</head>
<body>
<div id="title">
  <canvas id="title-bg" width="400" height="300"></canvas>
  <div id="title-content">
    <h1>OASIS</h1>
    <div class="sub">BATTLE ARENA</div>
    <div class="desc">
      Enter the wasteland. Fight. Collect. Survive.<br><br>
      <b>WASD</b> to move &middot; <b>Mouse</b> to look &middot; <b>Space</b> to jump &middot; <b>Click</b> to attack<br>
      <b>Mobile:</b> left stick move, right stick look, buttons to attack/jump
    </div>
    <div class="enter">[ ENTER THE ARENA ]</div>
  </div>
</div>
<div id="hud">
  <div class="hud-top-center">
    <div class="hud-player-name">B3ICEDRAGE</div>
    <div class="hud-location">PLANET ROTO</div>
  </div>
  <div class="hud-score">
    <div class="hud-score-val" id="score-val">0</div>
    <div class="hud-score-label">COINS</div>
  </div>
  <div class="hud-bonus"><div class="hud-bonus-val" id="bonus-val">BONUS 0</div></div>
  <div class="hud-multiplier" id="multiplier-text"></div>
  <div class="hud-attack" id="attack-indicator"><div class="hud-attack-text">ATTACK</div></div>
  <div class="hud-combo" id="combo-text"></div>
  <div class="hud-bottom">
    <div class="hud-health-wrap">
      <div class="hud-health-label">HEALTH</div>
      <div class="hud-health-bar"><div class="hud-health-fill" id="health-fill"></div>
        <div class="hud-health-segments" id="health-segs"></div>
      </div>
    </div>
  </div>
</div>
<div id="mobile-controls">
  <div id="mc-move" class="mc-zone"><div id="mc-knob"></div></div>
  <div id="mc-move-label" class="mc-label">MOVE</div>
  <div id="mc-look" class="mc-zone"><div id="mc-look-knob"></div></div>
  <div id="mc-look-label" class="mc-label">LOOK</div>
  <div id="mc-attack">ATK</div>
  <div id="mc-jump">JUMP</div>
</div>
<canvas id="c"></canvas>
<script>
var cv,ctx,titleCv,titleCtx,titleAnimId,SW=800,SH=450;
var state='title',frameCount=0;
var camX=0,camZ=0,camAngle=Math.PI,camPitch=0.3,camDist=8;
var playerX=0,playerZ=20,playerAngle=0;
var playerHealth=100,playerMaxHealth=100,playerSpeed=6;
var playerVelY=0,playerY=0,playerGrounded=true;
var playerAttackCooldown=0,attackAnim=0;
var score=0,bonus=0,multiplier=1,multiplierTimer=0,comboCount=0,comboTimer=0;
var keys={},pointerLocked=false;
var isMobileDevice=/Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
var mcMoveDX=0,mcMoveDY=0,mcLookDX=0,mcLookDY=0,mcAttack=false,mcJump=false;
var coins=[],enemies=[],particles=[],structures=[],floatingTexts=[];
var AC=null,dustTimer=0,stepTimer=0;

function initAudio(){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  var buf=AC.createBuffer(2,AC.sampleRate*4,AC.sampleRate);
  for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch),prev=0;
    for(var i=0;i<d.length;i++){var w=Math.random()*2-1;d[i]=(prev+0.02*w)/1.02;prev=d[i];d[i]*=3;}}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var lpf=AC.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=200;
  var g=AC.createGain();g.gain.value=0.06;
  src.connect(lpf);lpf.connect(g);g.connect(AC.destination);src.start();
}
function sfx(type){
  if(!AC)return;var t=AC.currentTime;
  if(type==='coin'){[800,1000,1200].forEach(function(f,i){
    var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.08,t+i*0.06);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.12);
    o.connect(g);g.connect(AC.destination);o.start(t+i*0.06);o.stop(t+i*0.06+0.12);});}
  else if(type==='hit'){var o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(60,t+0.15);
    g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.15);}
  else if(type==='attack'){var o=AC.createOscillator(),g=AC.createGain();o.type='square';
    o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(600,t+0.05);
    o.frequency.exponentialRampToValueAtTime(150,t+0.1);
    g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.1);}
  else if(type==='jump'){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(500,t+0.15);
    g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2);}
  else if(type==='death'){[400,300,200,100].forEach(function(f,i){
    var o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;
    g.gain.setValueAtTime(0.08,t+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.2);
    o.connect(g);g.connect(AC.destination);o.start(t+i*0.15);o.stop(t+i*0.15+0.2);});}
  else if(type==='step'){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
    o.frequency.value=50+Math.random()*20;g.gain.setValueAtTime(0.03,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.06);}
}

function initWorld(){
  coins=[];enemies=[];structures=[];particles=[];floatingTexts=[];
  for(var i=0;i<40;i++){coins.push({x:(Math.random()-0.5)*80,z:Math.random()*60-10,
    y:1.5+Math.random()*2,bobPhase:Math.random()*Math.PI*2,collected:false,radius:0.6,spin:Math.random()*2+1});}
  for(var i=0;i<12;i++){var ea=Math.random()*Math.PI*2,er=12+Math.random()*25;enemies.push({x:playerX+Math.cos(ea)*er,z:playerZ+Math.sin(ea)*er,y:1.2,
    health:3,maxHealth:3,speed:1.5+Math.random(),damage:8,alive:true,hitTimer:0,
    bobPhase:Math.random()*Math.PI*2,radius:1.0,
    type:['drone','crawler','turret'][Math.floor(Math.random()*3)]});}
  [{x:-30,z:-5,w:4,h:15},{x:30,z:-8,w:5,h:18},{x:0,z:-25,w:12,h:20},{x:-15,z:-15,w:8,h:6},
   {x:15,z:-20,w:6,h:8},{x:-40,z:20,w:3,h:25},{x:40,z:15,w:4,h:22},{x:-8,z:30,w:6,h:10},
   {x:20,z:35,w:5,h:14},{x:-25,z:35,w:7,h:8},{x:-28,z:5,w:3,h:12},{x:32,z:8,w:3,h:10}
  ].forEach(function(s){structures.push({x:s.x,z:s.z,w:s.w,h:s.h,color:'#2a1800',
    glowPhase:Math.random()*Math.PI*2});});
  var segs=document.getElementById('health-segs');segs.innerHTML='';
  for(var i=0;i<10;i++){var seg=document.createElement('div');seg.className='hud-health-seg';segs.appendChild(seg);}
}

function project(wx,wy,wz){
  var dx=wx-camX,dz=wz-camZ,cos=Math.cos(camAngle),sin=Math.sin(camAngle);
  var relX=dx*sin+dz*cos,relZ=-dx*cos+dz*sin;
  if(relZ<0.5)return null;var scale=6/relZ;
  return{x:SW/2+relX*scale*50,y:SH/2+(wy-3-camPitch*relZ*0.5)*scale*50,scale:scale,z:relZ};
}

function render(){
  var t=frameCount*0.016;
  ctx.fillStyle='#1a0a00';ctx.fillRect(0,0,SW,SH);
  var skyGrad=ctx.createLinearGradient(0,0,0,SH*0.5);
  skyGrad.addColorStop(0,'#2a1000');skyGrad.addColorStop(0.3,'#552200');
  skyGrad.addColorStop(0.6,'#883300');skyGrad.addColorStop(1,'#aa4400');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,SW,SH*0.5);
  ctx.fillStyle='#1a0800';ctx.beginPath();ctx.moveTo(0,SH*0.4);
  for(var i=0;i<=SW;i+=20){var mh=Math.sin(i*0.008)*30+Math.sin(i*0.015+1)*20+Math.sin(i*0.003)*40;
    ctx.lineTo(i,SH*0.35-mh);}ctx.lineTo(SW,SH*0.4);ctx.fill();
  ctx.fillStyle='#221000';ctx.beginPath();ctx.moveTo(0,SH*0.45);
  for(var i=0;i<=SW;i+=15){var mh=Math.sin(i*0.01+2)*20+Math.sin(i*0.02+0.5)*15;
    ctx.lineTo(i,SH*0.4-mh);}ctx.lineTo(SW,SH*0.45);ctx.fill();
  var groundY=SH*0.5;
  var gndGrad=ctx.createLinearGradient(0,groundY,0,SH);
  gndGrad.addColorStop(0,'#553300');gndGrad.addColorStop(0.3,'#442200');gndGrad.addColorStop(1,'#221100');
  ctx.fillStyle=gndGrad;ctx.fillRect(0,groundY,SW,SH-groundY);
  ctx.globalAlpha=0.15;
  for(var gz=5;gz<50;gz+=3){var gp=project(0,0,gz);
    if(gp&&gp.y>groundY-5){ctx.strokeStyle='#ffaa00';ctx.lineWidth=Math.max(0.5,gp.scale*1.5);
      ctx.beginPath();ctx.moveTo(gp.x-SW,gp.y);ctx.lineTo(gp.x+SW,gp.y);ctx.stroke();}}
  for(var gx=-40;gx<=40;gx+=8){var gp1=project(gx,0,3),gp2=project(gx,0,50);
    if(gp1&&gp2){ctx.strokeStyle='#885500';ctx.lineWidth=0.5;ctx.beginPath();
      ctx.moveTo(gp1.x,Math.min(gp1.y,SH));ctx.lineTo(gp2.x,Math.max(gp2.y,groundY));ctx.stroke();}}
  ctx.globalAlpha=1;
  var renderList=[];
  structures.forEach(function(s){var bottom=project(s.x,0,s.z),top=project(s.x,s.h,s.z);
    if(bottom&&top)renderList.push({type:'structure',obj:s,depth:bottom.z,bottom:bottom,top:top});});
  coins.forEach(function(c){if(c.collected)return;var bob=c.y+Math.sin(t*c.spin+c.bobPhase)*0.3;
    var p=project(c.x,bob,c.z);if(p)renderList.push({type:'coin',obj:c,depth:p.z,proj:p,bob:bob});});
  enemies.forEach(function(e){if(!e.alive)return;var bob=e.y+Math.sin(t*2+e.bobPhase)*0.2;
    var p=project(e.x,bob,e.z);if(p)renderList.push({type:'enemy',obj:e,depth:p.z,proj:p,bob:bob});});
  var pp=project(playerX,playerY+1.5,playerZ);
  if(pp)renderList.push({type:'player',depth:pp.z,proj:pp});
  renderList.sort(function(a,b){return b.depth-a.depth;});
  renderList.forEach(function(item){
    if(item.type==='structure')renderStructure(item);
    else if(item.type==='coin')renderCoin(item,t);
    else if(item.type==='enemy')renderEnemy(item,t);
    else if(item.type==='player')renderPlayer(item,t);});
  ctx.globalAlpha=0.3;
  particles.forEach(function(p){var pp=project(p.x,p.y,p.z);if(pp){
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life*0.4;
    ctx.beginPath();ctx.arc(pp.x,pp.y,Math.max(1,pp.scale*p.size*10),0,Math.PI*2);ctx.fill();}});
  ctx.globalAlpha=1;renderPostFX(t);
}

function renderStructure(item){
  var s=item.obj,b=item.bottom,tp=item.top;
  var sw=s.w*b.scale*50,sh=b.y-tp.y;
  ctx.fillStyle=s.color;ctx.fillRect(b.x-sw/2,tp.y,sw,sh);
  var glow=0.2+Math.sin(frameCount*0.02+s.glowPhase)*0.1;
  ctx.strokeStyle='rgba(255,100,0,'+glow+')';ctx.lineWidth=Math.max(1,b.scale*2);
  ctx.strokeRect(b.x-sw/2,tp.y,sw,sh);
  var tg=ctx.createRadialGradient(b.x,tp.y,0,b.x,tp.y,sw);
  tg.addColorStop(0,'rgba(255,100,0,.15)');tg.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=tg;ctx.beginPath();ctx.arc(b.x,tp.y,sw,0,Math.PI*2);ctx.fill();
  if(b.scale>0.3){var nw=Math.min(4,Math.floor(sh/(b.scale*30)));
    for(var i=0;i<nw;i++){var wy=tp.y+sh*(0.2+i*0.2),ww=sw*0.3,wh=sh*0.05;
      ctx.fillStyle='rgba(255,150,50,'+(0.2+Math.sin(frameCount*0.03+i)*0.1)+')';
      ctx.fillRect(b.x-ww/2,wy,ww,wh);}}
}

function renderCoin(item,t){
  var c=item.obj,p=item.proj,r=c.radius*p.scale*50;
  var glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);
  glow.addColorStop(0,'rgba(255,200,0,.25)');glow.addColorStop(0.5,'rgba(255,150,0,.08)');
  glow.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,r*3,0,Math.PI*2);ctx.fill();
  var pulse=0.7+Math.sin(t*3+c.bobPhase)*0.3;
  var coinGrad=ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,0,p.x,p.y,r);
  coinGrad.addColorStop(0,'#ffff88');coinGrad.addColorStop(0.4,'#ffcc00');coinGrad.addColorStop(1,'#cc8800');
  ctx.fillStyle=coinGrad;ctx.shadowColor='#ffaa00';ctx.shadowBlur=12*pulse;
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,220,'+(pulse*0.6)+')';
  ctx.beginPath();ctx.arc(p.x-r*0.25,p.y-r*0.25,r*0.3,0,Math.PI*2);ctx.fill();
}

function renderEnemy(item,t){
  var e=item.obj,p=item.proj,r=e.radius*p.scale*50,hf=e.hitTimer>0?1:0;
  var sp=project(e.x,0,e.z);
  if(sp){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();
    ctx.ellipse(sp.x,sp.y,r*1.2,r*0.3,0,0,Math.PI*2);ctx.fill();}
  if(e.type==='drone'){
    ctx.fillStyle=hf?'#ffffff':'#880000';ctx.shadowColor='#ff0000';ctx.shadowBlur=15;
    ctx.beginPath();ctx.moveTo(p.x,p.y-r);ctx.lineTo(p.x+r*0.8,p.y);
    ctx.lineTo(p.x,p.y+r*0.6);ctx.lineTo(p.x-r*0.8,p.y);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff0000';ctx.shadowBlur=10;ctx.beginPath();
    ctx.arc(p.x,p.y-r*0.1,r*0.2,0,Math.PI*2);ctx.fill();
  }else if(e.type==='crawler'){
    ctx.fillStyle=hf?'#ffffff':'#661100';ctx.shadowColor='#ff3300';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(p.x,p.y-r);ctx.lineTo(p.x+r,p.y+r*0.5);
    ctx.lineTo(p.x-r,p.y+r*0.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff4400';ctx.beginPath();
    ctx.arc(p.x-r*0.3,p.y-r*0.2,r*0.12,0,Math.PI*2);
    ctx.arc(p.x+r*0.3,p.y-r*0.2,r*0.12,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle=hf?'#ffffff':'#442200';ctx.shadowColor='#ff6600';ctx.shadowBlur=10;
    ctx.fillRect(p.x-r*0.6,p.y-r*0.8,r*1.2,r*1.2);
    ctx.fillStyle='#ff4400';ctx.fillRect(p.x-r*0.15,p.y+r*0.4,r*0.3,r*0.6);
  }
  ctx.shadowBlur=0;
  if(e.health<e.maxHealth){var hbW=r*1.5,hbH=Math.max(3,p.scale*4);
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-hbW/2,p.y-r-hbH-4,hbW,hbH);
    ctx.fillStyle='#ff3300';ctx.fillRect(p.x-hbW/2,p.y-r-hbH-4,hbW*(e.health/e.maxHealth),hbH);}
}

function renderPlayer(item,t){
  var p=item.proj,sc=p.scale,bH=3.5*sc*50,bW=1.2*sc*50,headR=0.5*sc*50,baseY=p.y+bH*0.3;
  var sp=project(playerX,0,playerZ);
  if(sp){ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();
    ctx.ellipse(sp.x,sp.y,bW*1.5,bW*0.3,0,0,Math.PI*2);ctx.fill();}
  var legSwing=attackAnim>0?Math.sin(attackAnim*10)*bW*0.3:Math.sin(t*6)*bW*0.15;
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(p.x-bW*0.4-legSwing,baseY-bH*0.15,bW*0.3,bH*0.35);
  ctx.fillRect(p.x+bW*0.1+legSwing,baseY-bH*0.15,bW*0.3,bH*0.35);
  ctx.fillStyle='rgba(255,150,0,.3)';
  ctx.fillRect(p.x-bW*0.4-legSwing,baseY+bH*0.15,bW*0.3,bH*0.05);
  ctx.fillRect(p.x+bW*0.1+legSwing,baseY+bH*0.15,bW*0.3,bH*0.05);
  var bodyGrad=ctx.createLinearGradient(p.x-bW,baseY-bH*0.5,p.x+bW,baseY);
  bodyGrad.addColorStop(0,'#2a2a3e');bodyGrad.addColorStop(0.5,'#3a3a5e');bodyGrad.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=bodyGrad;ctx.fillRect(p.x-bW/2,baseY-bH*0.5,bW,bH*0.35);
  ctx.strokeStyle='rgba(255,150,0,.4)';ctx.lineWidth=Math.max(1,sc*3);
  ctx.strokeRect(p.x-bW/2,baseY-bH*0.5,bW,bH*0.35);
  var cg=0.5+Math.sin(t*3)*0.3;
  ctx.fillStyle='rgba(255,150,0,'+cg+')';ctx.shadowColor='#ff9900';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(p.x,baseY-bH*0.35,bW*0.15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  var armSwing=attackAnim>0?-Math.sin(attackAnim*15)*bW*0.8:Math.sin(t*6)*bW*0.15;
  ctx.fillStyle='#2a2a3e';ctx.fillRect(p.x-bW*0.7,baseY-bH*0.45,bW*0.25,bH*0.25);
  ctx.save();ctx.translate(p.x+bW*0.5,baseY-bH*0.4);ctx.rotate(attackAnim>0?-attackAnim*0.5:0);
  ctx.fillStyle='#3a3a5e';ctx.fillRect(0,0,bW*0.25,bH*0.3);
  if(attackAnim>0){ctx.fillStyle='rgba(255,100,0,'+(attackAnim*2)+')';ctx.shadowColor='#ff4400';
    ctx.shadowBlur=15;ctx.fillRect(-bW*0.1,bH*0.3,bW*0.45,bH*0.1);ctx.shadowBlur=0;}
  ctx.restore();
  var headGrad=ctx.createRadialGradient(p.x,baseY-bH*0.6,0,p.x,baseY-bH*0.6,headR);
  headGrad.addColorStop(0,'#4a4a6e');headGrad.addColorStop(1,'#2a2a3e');
  ctx.fillStyle=headGrad;ctx.beginPath();ctx.arc(p.x,baseY-bH*0.6,headR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff8800';ctx.shadowColor='#ff6600';ctx.shadowBlur=8;
  ctx.fillRect(p.x-headR*0.7,baseY-bH*0.62,headR*1.4,headR*0.35);ctx.shadowBlur=0;
  ctx.fillStyle='#222238';ctx.fillRect(p.x-bW*0.35,baseY-bH*0.48,bW*0.15,bH*0.2);
  ctx.fillStyle='rgba(255,100,0,'+(0.3+Math.sin(t*8)*0.15)+')';
  ctx.beginPath();ctx.arc(p.x-bW*0.28,baseY-bH*0.28,bW*0.08,0,Math.PI*2);ctx.fill();
}

function renderPostFX(t){
  var vig=ctx.createRadialGradient(SW/2,SH/2,SW*0.25,SW/2,SH/2,SW*0.7);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,SW,SH);
  ctx.globalAlpha=0.04;
  for(var i=0;i<5;i++){var hy=SH*0.5+Math.sin(t*0.5+i*2)*20+i*30;
    ctx.strokeStyle='#ff8800';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,hy);
    for(var x=0;x<SW;x+=10)ctx.lineTo(x,hy+Math.sin(x*0.02+t*2+i)*3);ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.globalAlpha=0.03;for(var y=0;y<SH;y+=3){ctx.fillStyle='#000';ctx.fillRect(0,y,SW,1);}
  ctx.globalAlpha=1;
  if(playerHealth<30){ctx.globalAlpha=(1-playerHealth/30)*0.15*(0.5+Math.sin(t*4)*0.5);
    ctx.fillStyle='#ff0000';ctx.fillRect(0,0,SW,SH);ctx.globalAlpha=1;}
}

function update(dt){
  if(state!=='playing')return;frameCount++;var t=frameCount*0.016;
  if(attackAnim>0)attackAnim-=dt*4;if(attackAnim<0)attackAnim=0;
  if(playerAttackCooldown>0)playerAttackCooldown-=dt;
  var fwdX=Math.cos(playerAngle),fwdZ=Math.sin(playerAngle);
  var rightX=Math.cos(playerAngle+Math.PI/2),rightZ=Math.sin(playerAngle+Math.PI/2);
  var mx=0,mz=0;
  if(keys['w']||keys['W']||keys['ArrowUp']||mcMoveDY<-0.2){mx+=fwdX;mz+=fwdZ;}
  if(keys['s']||keys['S']||keys['ArrowDown']||mcMoveDY>0.2){mx-=fwdX;mz-=fwdZ;}
  if(keys['a']||keys['A']||mcMoveDX<-0.2){mx-=rightX;mz-=rightZ;}
  if(keys['d']||keys['D']||mcMoveDX>0.2){mx+=rightX;mz+=rightZ;}
  var len=Math.sqrt(mx*mx+mz*mz);
  if(len>0){mx=mx/len*playerSpeed*dt;mz=mz/len*playerSpeed*dt;
    playerX+=mx;playerZ+=mz;stepTimer-=dt;if(stepTimer<=0){sfx('step');stepTimer=0.3;}}
  if(!isMobileDevice){if(keys['ArrowLeft'])playerAngle-=2*dt;if(keys['ArrowRight'])playerAngle+=2*dt;}
  if(mcLookTouchId!==null||mcLookDX!==0)playerAngle+=mcLookDX*3*dt;
  if(!playerGrounded){playerVelY-=15*dt;playerY+=playerVelY*dt;
    if(playerY<=0){playerY=0;playerVelY=0;playerGrounded=true;}}
  if((keys[' ']||mcJump)&&playerGrounded){playerVelY=8;playerGrounded=false;sfx('jump');mcJump=false;keys[' ']=false;}
  playerX=Math.max(-38,Math.min(38,playerX));playerZ=Math.max(-15,Math.min(45,playerZ));
  camX=playerX+Math.cos(playerAngle)*camDist;camZ=playerZ+Math.sin(playerAngle)*camDist;camAngle=playerAngle+Math.PI;
  var doAttack=mcAttack&&playerAttackCooldown<=0;
  if(doAttack){mcAttack=false;isAttacking=true;attackAnim=1;playerAttackCooldown=0.4;sfx('attack');
    document.getElementById('attack-indicator').classList.add('show');
    setTimeout(function(){document.getElementById('attack-indicator').classList.remove('show');},300);
    enemies.forEach(function(e){if(!e.alive)return;
      var dx=e.x-playerX,dz=e.z-playerZ,dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<4){e.health--;e.hitTimer=0.2;sfx('hit');spawnParticles(e.x,1.5,e.z,'#ff4400',8);
        if(e.health<=0){e.alive=false;var pts=[50,75,100][Math.floor(Math.random()*3)]*multiplier;
          score+=pts;comboCount++;comboTimer=2;if(comboCount>2){multiplier=Math.min(5,Math.floor(comboCount/2)+1);multiplierTimer=3;}
          bonus+=10;spawnParticles(e.x,1.5,e.z,'#ffaa00',15);spawnFloatingText(e.x,3,e.z,'+'+pts,'#ffdd00');sfx('coin');}}});}
  coins.forEach(function(c){if(c.collected)return;
    var dx=c.x-playerX,dz=c.z-playerZ,dy=(c.y+Math.sin(t*c.spin+c.bobPhase)*0.3)-(playerY+1.5);
    var dist=Math.sqrt(dx*dx+dz*dz+dy*dy);
    if(dist<2.5){c.collected=true;var pts=10*multiplier;score+=pts;bonus+=5;comboCount++;comboTimer=2;
      sfx('coin');spawnParticles(c.x,c.y,c.z,'#ffcc00',10);spawnFloatingText(c.x,c.y+1,c.z,'+'+pts,'#ffdd00');}});
  enemies.forEach(function(e){if(!e.alive)return;if(e.hitTimer>0)e.hitTimer-=dt;
    var dx=playerX-e.x,dz=playerZ-e.z,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>2&&dist<25){e.x+=(dx/dist)*e.speed*dt;e.z+=(dz/dist)*e.speed*dt;}
    if(dist<2){playerHealth-=e.damage*dt;
      if(playerHealth<=0){playerHealth=0;state='dead';sfx('death');
        setTimeout(function(){if(confirm('Defeated! Score: '+score+'\nRestart?'))restartGame();},500);}}
    e.bobPhase+=dt;});
  enemies.forEach(function(e){if(!e.alive&&Math.random()<0.003){e.alive=true;e.health=e.maxHealth;
    var ra=Math.random()*Math.PI*2,rr=15+Math.random()*20;e.x=playerX+Math.cos(ra)*rr;e.z=playerZ+Math.sin(ra)*rr;
    e.x=Math.max(-38,Math.min(38,e.x));e.z=Math.max(-15,Math.min(45,e.z));}});
  coins.forEach(function(c){if(c.collected&&Math.random()<0.005){c.collected=false;
    c.x=playerX+(Math.random()-0.5)*50;c.z=playerZ+(Math.random()-0.5)*50;
    c.x=Math.max(-38,Math.min(38,c.x));c.z=Math.max(-15,Math.min(45,c.z));}});
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboCount=0;}
  if(multiplierTimer>0){multiplierTimer-=dt;if(multiplierTimer<=0)multiplier=1;}
  dustTimer-=dt;if(dustTimer<=0){dustTimer=0.1;
    spawnParticles(playerX+(Math.random()-0.5)*40,0.2,playerZ+(Math.random()-0.5)*40,'#aa7733',1);}
  for(var i=particles.length-1;i>=0;i--){var pp=particles[i];
    pp.x+=pp.vx;pp.y+=pp.vy;pp.z+=pp.vz;pp.vy-=0.02;pp.life-=0.02;if(pp.life<=0)particles.splice(i,1);}
  for(var i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].life-=dt;if(floatingTexts[i].life<=0)floatingTexts.splice(i,1);}
  document.getElementById('score-val').textContent=score.toLocaleString();
  document.getElementById('bonus-val').textContent='BONUS '+bonus;
  document.getElementById('health-fill').style.width=(playerHealth/playerMaxHealth*100)+'%';
  var comboEl=document.getElementById('combo-text');
  if(multiplier>1){comboEl.textContent=multiplier+'X';comboEl.style.display='block';}
  else{comboEl.style.display='none';}
  var multEl=document.getElementById('multiplier-text');
  if(multiplierTimer>0&&multiplier>1)multEl.textContent=multiplier+'X SCORE\nMULTIPLIER\nUP!';
  else multEl.textContent='';
  floatingTexts.forEach(function(ft){var pp=project(ft.x,ft.y+(1.2-ft.life)*3,ft.z);
    if(pp){var el=ft.el;if(!el){el=document.createElement('div');el.className='float-text';
      el.style.color=ft.color;el.style.fontSize='16px';el.style.textShadow='0 0 8px '+ft.color;
      document.getElementById('hud').appendChild(el);ft.el=el;}
      el.textContent=ft.text;el.style.left=pp.x+'px';el.style.top=pp.y+'px';el.style.opacity=ft.life;}});
}

function spawnParticles(x,y,z,color,count){
  for(var i=0;i<count;i++)particles.push({x:x,y:y,z:z,vx:(Math.random()-0.5)*3,
    vy:Math.random()*3+1,vz:(Math.random()-0.5)*3,life:0.8+Math.random()*0.4,color:color,size:0.3+Math.random()*0.5});}
function spawnFloatingText(x,y,z,text,color){floatingTexts.push({x:x,y:y,z:z,text:text,color:color,life:1.2,el:null});}
function restartGame(){playerX=0;playerZ=20;playerAngle=Math.PI;playerHealth=playerMaxHealth;
  playerY=0;playerVelY=0;playerGrounded=true;score=0;bonus=0;multiplier=1;comboCount=0;state='playing';
  initWorld();floatingTexts.forEach(function(ft){if(ft.el)ft.el.remove();});floatingTexts=[];}

function drawTitle(t){if(!titleCv)return;var w=titleCv.width,h=titleCv.height;
  titleCtx.fillStyle='#1a0a00';titleCtx.fillRect(0,0,w,h);
  for(var i=0;i<15;i++){var y=h*0.45+(h*0.55)*(i/15),alpha=(i/15)*0.2;
    titleCtx.strokeStyle='rgba(255,150,0,'+alpha+')';titleCtx.lineWidth=1;
    titleCtx.beginPath();titleCtx.moveTo(0,y);titleCtx.lineTo(w,y);titleCtx.stroke();}
  titleCtx.fillStyle='rgba(80,40,0,.3)';
  titleCtx.fillRect(w*0.15,h*0.2,15,h*0.25);titleCtx.fillRect(w*0.7,h*0.15,20,h*0.3);
  titleCtx.fillRect(w*0.4,h*0.25,10,h*0.2);}
function animateTitle(t){drawTitle(t);titleAnimId=requestAnimationFrame(animateTitle);}

function resize(){var dpr=window.devicePixelRatio||1;
  cv.width=SW*dpr;cv.height=SH*dpr;cv.style.width='100%';cv.style.height='100%';ctx.setTransform(dpr,0,0,dpr,0,0);}
function gameLoop(){var dt=1/60;update(dt);if(state==='playing'||state==='dead')render();
  requestAnimationFrame(gameLoop);}

function boot(){
  cv=document.getElementById('c');ctx=cv.getContext('2d');resize();window.addEventListener('resize',resize);
  titleCv=document.getElementById('title-bg');titleCtx=titleCv.getContext('2d');animateTitle(0);
  var jackedIn=false;
  function jackIn(){if(jackedIn)return;jackedIn=true;cancelAnimationFrame(titleAnimId);
    document.getElementById('title').style.display='none';initAudio();initWorld();state='playing';
    playerX=0;playerZ=20;playerAngle=Math.PI;
    camX=playerX+Math.cos(playerAngle)*camDist;camZ=playerZ+Math.sin(playerAngle)*camDist;camAngle=playerAngle+Math.PI;
    requestAnimationFrame(gameLoop);}
  document.getElementById('title').addEventListener('click',jackIn);
  document.getElementById('title').addEventListener('touchend',function(e){e.preventDefault();jackIn();});
  document.addEventListener('keydown',function(e){keys[e.key]=true;});
  document.addEventListener('keyup',function(e){keys[e.key]=false;});
  document.addEventListener('click',function(){if(state==='playing'&&cv.requestPointerLock)cv.requestPointerLock();});
  document.addEventListener('pointerlockchange',function(){pointerLocked=document.pointerLockElement===cv;});
  document.addEventListener('mousemove',function(e){if(pointerLocked&&state==='playing')playerAngle+=e.movementX*0.003;});
  if(isMobileDevice){
    document.getElementById('mobile-controls').style.display='block';
    var moveZone=document.getElementById('mc-move'),moveKnob=document.getElementById('mc-knob');
    var lookZone=document.getElementById('mc-look'),lookKnob=document.getElementById('mc-look-knob');
    var moveRect,lookRect;
    function updateRects(){moveRect=moveZone.getBoundingClientRect();lookRect=lookZone.getBoundingClientRect();}
    updateRects();window.addEventListener('resize',updateRects);
    function handleTouch(e){e.preventDefault();updateRects();var mf=false,lf=false;
      for(var i=0;i<e.touches.length;i++){var touch=e.touches[i],tx=touch.clientX,ty=touch.clientY;
        if(tx>=moveRect.left&&tx<=moveRect.right&&ty>=moveRect.top&&ty<=moveRect.bottom){mf=true;
          var cx=moveRect.left+moveRect.width/2,cy=moveRect.top+moveRect.height/2;
          mcMoveDX=Math.max(-1,Math.min(1,(tx-cx)/(moveRect.width/2)));
          mcMoveDY=Math.max(-1,Math.min(1,(ty-cy)/(moveRect.height/2)));
          moveKnob.style.left=(45+mcMoveDX*30)+'px';moveKnob.style.top=(45+mcMoveDY*30)+'px';}
        if(tx>=lookRect.left&&tx<=lookRect.right&&ty>=lookRect.top&&ty<=lookRect.bottom){lf=true;
          var cx=lookRect.left+lookRect.width/2,cy=lookRect.top+lookRect.height/2;
          mcLookDX=Math.max(-1,Math.min(1,(tx-cx)/(lookRect.width/2)));
          mcLookDY=Math.max(-1,Math.min(1,(ty-cy)/(lookRect.height/2)));
          lookKnob.style.left=(50+mcLookDX*30)+'px';lookKnob.style.top=(50+mcLookDY*30)+'px';}}
      if(!mf){mcMoveDX=0;mcMoveDY=0;moveKnob.style.left='45px';moveKnob.style.top='45px';}
      if(!lf){mcLookDX=0;mcLookDY=0;lookKnob.style.left='50px';lookKnob.style.top='50px';}}
    moveZone.addEventListener('touchstart',function(e){e.preventDefault();handleTouch(e);},{passive:false});
    moveZone.addEventListener('touchmove',function(e){e.preventDefault();handleTouch(e);},{passive:false});
    lookZone.addEventListener('touchstart',function(e){e.preventDefault();handleTouch(e);},{passive:false});
    lookZone.addEventListener('touchmove',function(e){e.preventDefault();handleTouch(e);},{passive:false});
    document.addEventListener('touchend',function(){mcMoveDX=0;mcMoveDY=0;mcLookDX=0;mcLookDY=0;
      moveKnob.style.left='45px';moveKnob.style.top='45px';lookKnob.style.left='50px';lookKnob.style.top='50px';});
    document.getElementById('mc-attack').addEventListener('touchstart',function(e){e.preventDefault();mcAttack=true;},{passive:false});
    document.getElementById('mc-jump').addEventListener('touchstart',function(e){e.preventDefault();mcJump=true;},{passive:false});
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
